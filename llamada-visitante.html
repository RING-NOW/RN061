<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Portero Digital — Llamando</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --oro: #C9A84C; --fondo: #111; --texto: #f0ede8; --suave: #888; }

  body {
    background: var(--fondo);
    color: var(--texto);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #video-yo {
    width: 110px; height: 110px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    transform: scaleX(-1);
    flex-shrink: 0;
  }

  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: 56px 24px 68px;
    background: var(--fondo);
  }

  /* Marca */
  .ringnow-top {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 5px;
    color: rgba(255,255,255,0.15);
    text-transform: uppercase;
    align-self: center;
  }

  .llamando-sub {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #888;
  }
  .llamando-depto {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 80px;
    color: var(--oro);
    line-height: 1;
  }
  .llamando-edificio {
    font-size: 12px;
    color: #666;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
  }

  .pulso-ring {
    position: relative;
    width: 100px; height: 100px;
    display: flex; align-items: center; justify-content: center;
  }
  .pulso-ring::before, .pulso-ring::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    border: 2px solid var(--oro);
    animation: pulso 1.8s ease-out infinite;
  }
  .pulso-ring::after { animation-delay: 0.6s; }
  @keyframes pulso {
    0%   { width: 100px; height: 100px; opacity: 0.8; }
    100% { width: 170px; height: 170px; opacity: 0; }
  }

  .estado {
    font-size: 13px; color: #888;
    text-align: center; min-height: 20px;
    letter-spacing: 1px;
  }
  .estado.error { color: #e74c3c; }

  .btn-colgar {
    width: 72px; height: 72px;
    border-radius: 50%; border: none;
    background: #c0392b;
    font-size: 28px; cursor: pointer;
    box-shadow: 0 0 0 8px rgba(192,57,43,.2);
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s;
  }
  .btn-colgar:active { transform: scale(.9); }

  #pantalla-gracias {
    display: none;
    position: fixed; inset: 0; z-index: 10;
    background: var(--fondo);
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 40px;
  }
  #pantalla-gracias .gr-icon { font-size: 52px; }
  #pantalla-gracias .gr-txt  { font-size: 20px; font-weight: 700; }
  #pantalla-gracias .gr-sub  { font-size: 14px; color: var(--suave); }
  #pantalla-gracias .rn-badge {
    margin-top: 24px;
    font-size: 10px; font-weight: 700;
    letter-spacing: 5px; color: rgba(255,255,255,0.15);
    text-transform: uppercase;
  }

  #toast {
    position: fixed; bottom: 100px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,0.85); color: #fff;
    padding: 10px 20px; border-radius: 20px;
    font-size: 14px; opacity: 0; transition: all .3s;
    pointer-events: none; white-space: nowrap; z-index: 100;
  }
  #toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<audio id="audio-remoto" autoplay playsinline></audio>

<div class="overlay">
  <div class="ringnow-top">RingNow</div>

  <video id="video-yo" autoplay muted playsinline></video>

  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;flex:1;justify-content:center;">
    <div class="llamando-sub" id="llamando-sub">Llamando al depto</div>
    <div class="pulso-ring">
      <div class="llamando-depto" id="depto-num">—</div>
    </div>
    <div class="llamando-edificio" id="txt-edificio">—</div>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
    <div class="estado" id="estado">Activando cámara...</div>
    <button class="btn-colgar" onclick="colgar()">📵</button>
  </div>
</div>

<div id="pantalla-gracias">
  <div class="gr-icon">👋</div>
  <div class="gr-txt">¡Hasta luego!</div>
  <div class="gr-sub">Podés cerrar esta ventana</div>
  <div class="rn-badge">RINGNOW</div>
</div>

<div id="toast"></div>

<script>
// Aplicar config
document.getElementById('txt-edificio').textContent = RINGNOW_CONFIG.edificio.nombre;
</script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const ICE = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' }
]};

let db, pc, localStream, callRef, llamadaConectada = false, wakeLock = null;

firebase.initializeApp(RINGNOW_CONFIG.firebase);
db = firebase.database();

const params = new URLSearchParams(window.location.search);
const depto = parseInt(params.get('depto'));

if (!depto || isNaN(depto)) {
  window.location.href = 'timbre-visitante.html';
} else {
  history.replaceState(null, '', 'timbre-visitante.html');
  document.getElementById('depto-num').textContent = depto;
  iniciarLlamada(depto);
}

async function iniciarLlamada(n) {
  const callId = 'call_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
  const baseURL = RINGNOW_CONFIG.baseURL;
  const edificio = RINGNOW_CONFIG.edificio.nombre;

  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').then(function(wl) { wakeLock = wl; }).catch(function(){});
  }

  // Notificación ntfy al residente
  db.ref('canales/depto' + n).once('value').then(function(snap) {
    const canal = snap.val() && snap.val().canal;
    if (canal) {
      fetch('https://ntfy.sh/' + canal, {
        method: 'POST',
        headers: {
          'Title': 'Llamada Depto ' + n,
          'Priority': 'urgent',
          'Tags': 'bell',
          'Click': baseURL + '/timbre-residente.html?depto=' + n + '&callId=' + callId
        },
        body: 'Alguien tocó el timbre en ' + edificio
      }).catch(function(){});
    }
  }).catch(function(){});

  try {
    callRef = db.ref('calls/' + callId);
    await callRef.set({
      deptoId: n, status: 'ringing',
      timestamp: firebase.database.ServerValue.TIMESTAMP
    });
    setEstado('Llamando...');

    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      document.getElementById('video-yo').srcObject = localStream;
    } catch(e) {
      try { localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true }); }
      catch(e2) { localStream = null; }
    }

    // Preview periódico
    if (localStream && localStream.getVideoTracks().length > 0) {
      const canvas = document.createElement('canvas');
      const videoEl = document.getElementById('video-yo');
      const ctx = canvas.getContext('2d');
      const fotoInterval = setInterval(function() {
        if (!localStream) { clearInterval(fotoInterval); return; }
        try {
          canvas.width = videoEl.videoWidth || 320;
          canvas.height = videoEl.videoHeight || 240;
          ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
          callRef.update({ preview: canvas.toDataURL('image/jpeg', 0.5) });
        } catch(e) {}
      }, 2000);
      window._fotoInterval = fotoInterval;
    }

    pc = new RTCPeerConnection(ICE);
    if (localStream) localStream.getTracks().forEach(function(t) { pc.addTrack(t, localStream); });

    pc.ontrack = function(e) {
      if (e.streams[0]) {
        const a = document.getElementById('audio-remoto');
        a.srcObject = e.streams[0];
        a.play().catch(function(){});
      }
    };
    pc.onicecandidate = function(e) {
      if (e.candidate) callRef.child('visitorCandidates').push(e.candidate.toJSON());
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await callRef.update({ offer: { type: offer.type, sdp: offer.sdp } });
    setEstado('Esperando respuesta...');

    callRef.child('answer').on('value', async function(snap) {
      if (snap.val() && pc && !pc.currentRemoteDescription) {
        try {
          await pc.setRemoteDescription(new RTCSessionDescription(snap.val()));
          setEstado(''); llamadaConectada = true;
          document.getElementById('llamando-sub').textContent = 'Conectado al depto';
        } catch(e) {}
      }
    });

    callRef.child('residentCandidates').on('child_added', async function(snap) {
      if (snap.val() && pc) try { await pc.addIceCandidate(new RTCIceCandidate(snap.val())); } catch(e) {}
    });

    callRef.child('status').on('value', function(snap) {
      if (snap.val() === 'ended' || snap.val() === 'rejected') {
        colgar(false);
        toast(snap.val() === 'rejected' ? 'Sin respuesta' : 'Llamada finalizada');
      }
    });

    setTimeout(function() {
      if (!llamadaConectada) { colgar(true); toast('Sin respuesta'); }
    }, 90000);

  } catch(err) {
    setEstado('Error: ' + err.message, 'error');
    setTimeout(function() { colgar(false); }, 4000);
  }
}

function colgar(notif) {
  llamadaConectada = false;
  try { if (wakeLock) wakeLock.release(); } catch(e) {}
  try { if (window._fotoInterval) { clearInterval(window._fotoInterval); window._fotoInterval = null; } } catch(e) {}
  try { if (callRef) { callRef.update({ status: 'ended' }); callRef.off(); callRef = null; } } catch(e) {}
  try { if (pc) { pc.close(); pc = null; } } catch(e) {}
  try { if (localStream) { localStream.getTracks().forEach(function(t) { t.stop(); }); localStream = null; } } catch(e) {}
  window.location.replace(RINGNOW_CONFIG.baseURL + '/fin-visitante.html');
}

function setEstado(txt, cls) {
  const el = document.getElementById('estado');
  el.textContent = txt;
  el.className = 'estado' + (cls ? ' ' + cls : '');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('visible');
  setTimeout(function() { t.classList.remove('visible'); }, 3000);
}
</script>
</body>
</html>
