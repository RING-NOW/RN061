<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="config.js"></script>
</head>
<body style="background:#111;color:#fff;font-family:monospace;padding:20px;">

<div id="log"></div>

<script>
function log(msg, color) {
  var d = document.createElement('div');
  d.style.color = color || '#fff';
  d.style.margin = '4px 0';
  d.textContent = new Date().toISOString().substr(11,8) + ' ' + msg;
  document.getElementById('log').appendChild(d);
}

log('1. Página cargada');
log('2. config.js: ' + (typeof RINGNOW_CONFIG !== 'undefined' ? 'OK' : 'FALLO'), typeof RINGNOW_CONFIG !== 'undefined' ? '#3fb950' : '#f85149');
</script>

<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/compat/app/dist/index.js"
  onload="log('3. firebase-app cargado', '#3fb950')"
  onerror="log('3. firebase-app FALLO', '#f85149')">
</script>
<script src="https://cdn.jsdelivr.net/npm/firebase@9.23.0/compat/database/dist/index.js"
  onload="initFirebase()"
  onerror="log('4. firebase-db FALLO', '#f85149')">
</script>

<script>
function initFirebase() {
  log('4. firebase-database cargado', '#3fb950');
  try {
    firebase.initializeApp(RINGNOW_CONFIG.firebase);
    log('5. initializeApp OK', '#3fb950');
  } catch(e) {
    log('5. initializeApp FALLO: ' + e.message, '#f85149');
    return;
  }
  try {
    var db = firebase.database();
    log('6. database() OK', '#3fb950');
    db.ref('.info/connected').on('value', function(snap) {
      log('7. connected: ' + snap.val(), snap.val() ? '#3fb950' : '#d29922');
    });
  } catch(e) {
    log('6. database() FALLO: ' + e.message, '#f85149');
  }
}
</script>

</body>
</html>
