<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Portero Digital — RINGNOW</title>
<script src="config.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #7a5510;
    padding: 0;
    font-family: 'Barlow Condensed', Verdana, sans-serif;
  }

  /* PLACA */
  .placa {
    width: 100%;
    min-height: 100vh;
    background: linear-gradient(160deg, #9a7020 0%, #7a5510 40%, #5a3a08 100%);
    padding: 36px 24px 28px;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* MARCA RINGNOW */
  .ringnow-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 24px;
  }
  .ringnow-logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 5px;
    color: rgba(255, 210, 80, 0.5);
    text-transform: uppercase;
  }
  .ringnow-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(255, 210, 80, 0.35);
  }

  /* DIRECCIÓN */
  .direccion {
    text-align: center;
    margin-bottom: 40px;
    position: relative;
  }
  .direccion-etiqueta {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 4px;
    color: rgba(30,15,0,0.45);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .direccion-texto {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #2a1800;
    text-shadow: 0 1px 0 rgba(255,200,50,0.3), 0 -1px 0 rgba(0,0,0,0.3);
    text-transform: uppercase;
  }
  .direccion-linea {
    width: 40px; height: 1px;
    background: rgba(0,0,0,0.2);
    margin: 10px auto 0;
    position: relative;
  }
  .direccion-linea::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,200,50,0.15);
    transform: translateY(1px);
  }

  /* GRID DE TIMBRES */
  .timbres-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px 12px;
    margin-bottom: 36px;
    padding: 0 4px;
    flex: 1;
  }

  .timbre {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .timbre-boton {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: radial-gradient(circle at 38% 32%, #a07520 0%, #7a5510 45%, #4a3005 100%);
    box-shadow:
      inset 0 1px 3px rgba(220,180,60,0.35),
      inset 0 -2px 5px rgba(0,0,0,0.55),
      0 3px 8px rgba(0,0,0,0.45),
      0 1px 2px rgba(0,0,0,0.3);
    position: relative;
    transition: transform 0.1s, box-shadow 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .timbre-boton::after {
    content: '';
    position: absolute;
    top: 30%; left: 25%; right: 40%;
    height: 18%;
    background: rgba(255,220,80,0.12);
    border-radius: 50%;
    transform: rotate(-20deg);
  }
  .timbre-boton:active {
    transform: scale(0.90);
    box-shadow:
      inset 0 3px 7px rgba(0,0,0,0.75),
      0 1px 3px rgba(0,0,0,0.3);
  }

  .timbre-num {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #2a1800;
    text-shadow: 0 1px 0 rgba(255,200,50,0.2);
  }

  /* FOOTER */
  .footer {
    margin-top: auto;
  }
  .aviso-grabado {
    border-top: 1px solid rgba(0,0,0,0.2);
    padding-top: 14px;
    margin-bottom: 12px;
    position: relative;
  }
  .aviso-grabado::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: rgba(255,200,50,0.12);
    margin-top: 1px;
  }
  .aviso-texto {
    font-size: 9px;
    line-height: 1.65;
    color: rgba(30,15,0,0.6);
    text-align: center;
    letter-spacing: 0.2px;
    text-shadow: 0 1px 0 rgba(255,200,50,0.1);
  }
  .ringnow-footer {
    text-align: center;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 4px;
    color: rgba(30,15,0,0.3);
    text-transform: uppercase;
    padding-bottom: 4px;
  }

  /* Loading / estado */
  #diag-box {
    text-align: center;
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(30,15,0,0.45);
    margin-bottom: 12px;
    min-height: 16px;
  }
  #pantalla-seleccion { display: none; }

  /* Toast */
  #toast {
    position: fixed; bottom: 40px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,0.85); color: #fff;
    padding: 10px 20px; border-radius: 20px;
    font-size: 13px; font-family: sans-serif;
    opacity: 0; transition: all .3s;
    pointer-events: none; white-space: nowrap; z-index: 100;
  }
  #toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="placa">

  <div class="ringnow-header">
    <div class="ringnow-dot"></div>
    <div class="ringnow-logo">RingNow</div>
    <div class="ringnow-dot"></div>
  </div>

  <div class="direccion">
    <div class="direccion-etiqueta">Portero Digital</div>
    <div class="direccion-texto" id="txt-direccion">—</div>
    <div class="direccion-linea"></div>
  </div>

  <div id="diag-box">CONECTANDO...</div>

  <div id="pantalla-seleccion">
    <div class="timbres-grid" id="grid"></div>
  </div>

  <div class="footer">
    <div class="aviso-grabado">
      <div class="aviso-texto">
        Tocar un timbre activa su cámara para que el residente pueda identificarlo en tiempo real,
        e implica la aceptación de los términos del sistema. La conexión es directa y privada
        entre dispositivos (WebRTC), conforme a la Ley 25.326.
      </div>
    </div>
    <div class="ringnow-footer">RINGNOW</div>
  </div>

</div>

<div id="toast"></div>

<script>
// Aplicar config
document.getElementById('txt-direccion').textContent = RINGNOW_CONFIG.edificio.nombre;
document.title = 'Portero Digital — ' + RINGNOW_CONFIG.edificio.nombre;
</script>

<script>
window.addEventListener('load', function() {
  function tryLoad(urls, idx, onSuccess, onFail) {
    if (idx >= urls.length) { onFail(); return; }
    var s = document.createElement('script');
    s.src = urls[idx];
    s.onload = onSuccess;
    s.onerror = function() { tryLoad(urls, idx+1, onSuccess, onFail); };
    document.head.appendChild(s);
  }
  var appUrls = [
    'https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js',
    'https://cdn.jsdelivr.net/npm/firebase@9.22.2/compat/app/dist/index.js',
    'https://unpkg.com/firebase@9.22.2/compat/app/dist/index.js'
  ];
  var dbUrls = [
    'https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js',
    'https://cdn.jsdelivr.net/npm/firebase@9.22.2/compat/database/dist/index.js',
    'https://unpkg.com/firebase@9.22.2/compat/database/dist/index.js'
  ];
  tryLoad(appUrls, 0, function() {
    tryLoad(dbUrls, 0, sdkListo, sdkError);
  }, sdkError);
});
</script>

<script>
let db;

function sdkError() {
  const box = document.getElementById('diag-box');
  box.textContent = '⚠️ Sin conexión a internet';
  box.style.color = '#c0392b';
}

function sdkListo() {
  const cfg = RINGNOW_CONFIG.firebase;
  if (!cfg.apiKey) { sdkError(); return; }

  try { firebase.initializeApp(cfg); } catch(e) { sdkError(); return; }

  try { db = firebase.database(); } catch(e) { sdkError(); return; }

  db.ref('.info/connected').on('value', function(snap) {
    if (snap.val() === true) mostrarListo();
  });

  setTimeout(function() {
    if (document.getElementById('pantalla-seleccion').style.display === 'none') mostrarListo();
  }, 8000);
}

function mostrarListo() {
  renderGrid();
  document.getElementById('pantalla-seleccion').style.display = 'block';
  const b = document.getElementById('diag-box');
  b.style.transition = 'opacity .5s'; b.style.opacity = '0';
  setTimeout(function() { b.style.display = 'none'; }, 600);
}

function renderGrid() {
  const g = document.getElementById('grid');
  g.innerHTML = '';
  RINGNOW_CONFIG.deptos.forEach(function(n) {
    const wrap = document.createElement('div');
    wrap.className = 'timbre';
    wrap.innerHTML =
      '<button class="timbre-boton" onclick="llamar(' + n + ')"></button>' +
      '<span class="timbre-num">' + n + '</span>';
    g.appendChild(wrap);
  });
}

function llamar(n) {
  window.location.href = 'llamada-visitante.html?depto=' + n;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('visible');
  setTimeout(function() { t.classList.remove('visible'); }, 3000);
}
</script>

</body>
</html>
